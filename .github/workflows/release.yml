name: Build and Release StyleVault

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag_step
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "APP_NAME=StyleVault-${TAG}" >> $GITHUB_OUTPUT

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Flutter platforms if missing
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            flutter create --org io.github.hiteshharidevan_nocode5 --project-name stylevault .
          else
            flutter create --platforms=android,linux .
          fi
          flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Linux Desktop Bundle
        run: flutter build linux --release

      - name: Package with matching filenames
        run: |
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-release.apk "release_assets/${{ steps.tag_step.outputs.APP_NAME }}.apk"
          cd build/linux/x64/release/bundle
          zip -r "../../../../../release_assets/${{ steps.tag_step.outputs.APP_NAME }}-linux.zip" .
          cd ../../../../../
          ls -lh release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_step.outputs.TAG }}
          name: StyleVault ${{ steps.tag_step.outputs.TAG }}
          body: |
            Privacy-first on-device personal stylist.
            - Android / Chromebook APK: `${{ steps.tag_step.outputs.APP_NAME }}.apk`
            - Linux / Crostini Archive: `${{ steps.tag_step.outputs.APP_NAME }}-linux.zip`
          files: |
            release_assets/${{ steps.tag_step.outputs.APP_NAME }}.apk
            release_assets/${{ steps.tag_step.outputs.APP_NAME }}-linux.zip

name: stylevault
description: Privacy-first on-device personal stylist and wardrobe matcher.
publish_to: 'none'
version: 0.2.5+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  http: ^1.2.2
  package_info_plus: ^8.0.2
  open_filex: ^4.5.0
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F8FAFC"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
